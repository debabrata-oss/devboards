# Gole Build the image for devboard frontend and push to docker hub after lintng the code  
name: CI

on:
  push:
     branches: [advanced]

jobs:
   code-lint:
     runs-on: ubuntu-latest
     steps: 
      - name: checkout code 
        uses: actions/checkout@v7
        
      # Step 2: Sets up the specified Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your Node.js version here
          cache: 'npm'       # Caches dependencies to make builds faster

      # Step 3: Install project dependencies cleanly
      - name: Install Dependencies
        run: npm ci
        
      - name: run linter
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          prettier: true
          
   buils-and-push:
     runs-on: ubuntu-latest
     steps:
       - name: check out code
         uses: actions/checkout@v7
         
       - name: Docker setup[login]
         uses: docker/login-action@v4
         with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
       - name: Docker build and push 
         uses: docker/build-push-action@v7
         with:
           context: ./frontend
           file: ./frontend/Dockerfile
           push: true
           tags: ${{ vars.DOCKERHUB_USERNAME }}/devboards-fe-advance:latest 
         
          
       

         
   
